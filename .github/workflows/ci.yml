name: Nx CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nx-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NX_DAEMON: 'false'
      NX_TUI: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Restore local Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm test:tools
      - run: pnpm graph:check
      - name: Verify affected projects on PRs, everything on main/manual runs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            pnpm exec nx affected -t verify,e2e --base="$BASE_SHA" --head="$GITHUB_SHA" --parallel=4 --outputStyle=static
          else
            pnpm exec nx run-many -t verify,e2e --parallel=4 --outputStyle=static
          fi
      - name: Upload graphs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nx-graphs-and-results
          path: |
            dist/graphs/
            dist/test/
            dist/e2e/
            dist/verify/
          if-no-files-found: warn
