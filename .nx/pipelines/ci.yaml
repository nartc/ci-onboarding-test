# yaml-language-server: $schema=https://cloud.nx.app/nx-cloud/static/schemas/workflow.schema.json
# DISPOSABLE ROUND 02: an intentional failed job makes PR CI red. Do not merge.
on:
  pull-requests:
    event: PR
    branches: [main]
  pushes:
    event: PUSH
    branches: [main]

self-healing:
  fix-tasks-patterns: []
  auto-apply-patterns: []

worker-templates: .nx/pipelines/chaos-workers.yaml

env:
  NX_CLOUD_AUTO_TASK_PACKING: 'true'
  CHAOS_TRIAL: round-02

jobs:
  main:
    runs-on: linux-medium-js
    workers: 3 linux-large-js
    timeout-minutes: 10
    steps:
      - name: Verify affected projects and run integration tests
        script: pnpm exec nx affected -t verify,e2e

  cache:
    needs: main
    if: nxcloud.event_name == 'pull_request'
    runs-on: linux-medium-js
    workers: false
    timeout-minutes: 6
    steps:
      - name: Validate the bounded lab
        run: pnpm chaos:check
      - name: Prove local and remote restoration and input invalidation
        run: node tools/chaos/cache-lab.mjs --remote

  boom:
    needs: cache
    if: nxcloud.event_name == 'pull_request'
    runs-on: linux-medium-js
    workers: false
    timeout-minutes: 2
    steps:
      - name: Start fresh failure evidence
        run: node tools/chaos/failure-lab.mjs start
      - name: Intentional untolerated exit 23
        id: expected_failure
        run: node tools/chaos/failure-lab.mjs fail
      - name: Default-success step must be skipped
        run: node tools/chaos/failure-lab.mjs forbidden
      - name: Handle the failed step
        if: failure()
        env:
          FAILURE_OUTCOME: ${{ steps.expected_failure.outcome }}
          FAILURE_CONCLUSION: ${{ steps.expected_failure.conclusion }}
          JOB_STATUS: ${{ job.status }}
        run: node tools/chaos/failure-lab.mjs failure-step
      - name: Always validate local cleanup evidence
        if: always()
        env:
          FAILURE_OUTCOME: ${{ steps.expected_failure.outcome }}
          FAILURE_CONCLUSION: ${{ steps.expected_failure.conclusion }}
          JOB_STATUS: ${{ job.status }}
        run: node tools/chaos/failure-lab.mjs cleanup-step

  sibling:
    needs: cache
    if: nxcloud.event_name == 'pull_request'
    runs-on: linux-medium-js
    workers: false
    timeout-minutes: 2
    steps:
      - name: Independent sibling can complete
        run: node tools/chaos/failure-lab.mjs sibling

  default_dependent:
    needs: boom
    if: nxcloud.event_name == 'pull_request'
    runs-on: linux-medium-js
    workers: false
    timeout-minutes: 2
    steps:
      - name: Probe implicit success guard after a failed dependency
        run: node tools/chaos/failure-lab.mjs forbidden

  explicit_success:
    needs: boom
    if: always() && needs.boom.result == 'success' && nxcloud.event_name == 'pull_request'
    runs-on: linux-medium-js
    workers: false
    timeout-minutes: 2
    steps:
      - name: Explicit success guard must skip this command
        run: node tools/chaos/failure-lab.mjs forbidden

  failure_handler:
    needs: boom
    if: always() && needs.boom.result == 'failure' && nxcloud.event_name == 'pull_request'
    runs-on: linux-medium-js
    workers: false
    timeout-minutes: 2
    steps:
      - name: Assert failed dependency result
        env:
          BOOM_RESULT: ${{ needs.boom.result }}
        run: node tools/chaos/failure-lab.mjs dependency-handler

  cleanup:
    needs: [cache, boom, sibling, default_dependent, explicit_success, failure_handler]
    if: always() && nxcloud.event_name == 'pull_request'
    runs-on: linux-medium-js
    workers: false
    timeout-minutes: 2
    steps:
      - name: Record and assert all dependency results despite the failed job
        env:
          CACHE_RESULT: ${{ needs.cache.result }}
          BOOM_RESULT: ${{ needs.boom.result }}
          SIBLING_RESULT: ${{ needs.sibling.result }}
          DEFAULT_RESULT: ${{ needs.default_dependent.result }}
          EXPLICIT_RESULT: ${{ needs.explicit_success.result }}
          HANDLER_RESULT: ${{ needs.failure_handler.result }}
        run: node tools/chaos/failure-lab.mjs join
